<!DOCTYPE html>
<html>

<head>

<fieldset>
  
<title>My Website</title>
<link rel="stylesheet" href="styles.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

/* Page background */
body{
    background-color:#f0f8ff;
    font-family: Arial, sans-serif;
}

/* Form container */
form{
    width:400px;
     margin:50px auto;
}

/* Fieldset styling */
fieldset{
     border:2px solid #007BFF;
     padding:20px;
     background-color:white;
     border-radius:10px;
}

/* Legend title */
legend{
     font-size:20px;
     font-weight:bold;
     color:#007BFF;
}
/* Labels */
label{
     font-weight:bold;
}

/* Text inputs */
input[type="text"]
select,
textarea{
     width:100%
     padding:8px;
     margin-top:5px;
     margin-bottom:15px;
     border:1px solid #ccc;
     border-radius:5px;
}

/* Radio and checkbox spacing */
input[type="radio"],
input[type="checkbox"]{
     margin-right:8px;
}

/* Buttons */
input[type="submit"],
input{type="reset"]{
     background-color:#007BFF;
     color:white;
     border:none;
     padding:10px 20px;
     margin-top:10px;
     border-radius:5px;
     cursor:pointer;
}

/* Button hover effect */
input[type="submit"]:hover,
input[type="reset"]:hover{
     background-color:#0056b3;
}
      
</style>

  <script>

function validateForm(){

let name= document.getElementById("fullname").value;
let email= document.getElementById("email").value;
let telephone= document.getElementById("telephone").value;

if(name === "" || email === "" || teelephone === ""){
alert("Please fill in all required fields");
return false;
}

return true;

}

</script>

</head>

<body>

<form>
<fieldset>
<h2>Contact Info</h2>


  Username:<br>
<input type="text" name="username"><br><br>

Email:<br>
<input type="text" name="email"><br><br>

Telephone:<br>
<input type="text" name="telephone"><br><br>


  
  <h2>Areas of Interest</h2>


  <input type="checkbox" name="interest" value="Account Executive"> Account Executive <br>

<input type="checkbox" name="interest" value="Business Development"> Business Development <br>

<input type="checkbox" name="interest" value="Inside Sales"> Inside Sales <br>

<input type="checkbox" name="interest" value="Sales Manager"> Sales Manager <br>

<input type="checkbox" name="interest" value="VP Sales"> VP Sales <br><br>


  <h2>Job Application</h2>

<!-- Drop-down list -->
<label>Type of Position:</label><br>
<select name="position">
<option value="parttime">Part-time</option>
<option value="fulltime">Full-time</option>
<option value="contract">Contract</option>
<option value="internship">Internship</option>
</select>

<br><br>

<!-- Radio buttons -->
<label>Willing to Relocate?</label><br>

<input type="radio" name="relocate" value="yes"> Yes<br>
<input type="radio" name="relocate" value="no"> No<br>

<br>

<!-- Buttons -->
<input type="submit" value="Submit">
<input type="reset" value="Reset">


</fieldset>
  
  






  
</form>


</body>
</html>
